<style>
:root{--bg:#0e0e12;--panel:#17171d;--line:#2a2a33;--text:#f2f2f5;--mute:#8d8d99;--acc:#ff6a5c;--acc2:#ffb15c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:8px 12px}
.brand{font-weight:800;font-size:21px;letter-spacing:.5px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:linear-gradient(90deg,var(--acc),var(--acc2));border:0;color:#1d0d06}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.35}
.btn svg{width:18px;height:18px;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#frame{position:relative;overflow:hidden;touch-action:none;display:none;box-shadow:0 6px 30px #0009}
#cv{display:block;width:100%;height:100%}
#empty{text-align:center;padding:24px;max-width:320px}
#empty .logo{width:96px;height:96px;border-radius:24px;margin:0 auto 18px;display:block}
#empty h1{font-size:24px;margin:0 0 6px}
#empty p{color:var(--mute);margin:0 0 22px}
#empty .btn{font-size:17px;padding:13px 26px}
#crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;display:none;
 background-image:linear-gradient(#fff5,#fff5),linear-gradient(#fff5,#fff5),linear-gradient(#fff5,#fff5),linear-gradient(#fff5,#fff5);
 background-size:1px 100%,1px 100%,100% 1px,100% 1px;background-position:33.33% 0,66.66% 0,0 33.33%,0 66.66%;background-repeat:no-repeat}
#crop i{position:absolute;width:20px;height:20px;border:4px solid #fff}
#crop i:nth-child(1){left:-5px;top:-5px;border-right:0;border-bottom:0}
#crop i:nth-child(2){right:-5px;top:-5px;border-left:0;border-bottom:0}
#crop i:nth-child(3){left:-5px;bottom:-5px;border-right:0;border-top:0}
#crop i:nth-child(4){right:-5px;bottom:-5px;border-left:0;border-top:0}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;font-size:12px;padding:5px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .3s}
#panel{background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#panel.off{opacity:.4;pointer-events:none}
#tools{height:150px;padding:10px 0 4px;overflow:hidden}
.tabs{display:flex;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar,.thumbs::-webkit-scrollbar{display:none}
.tab{flex:1 0 62px;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}

.tab.on{color:var(--text)}.tab.on svg{stroke:var(--acc)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.chip{flex:none;background:#24242c;border:0;color:var(--text);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg)}
.row{display:flex;align-items:center;gap:10px;padding:2px 16px}
.lbl{font-size:12px;color:var(--mute);width:62px;flex:none}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 1px 4px #0008}
input[type=range]::-moz-range-track{height:4px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}
.val{width:36px;text-align:right;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}

.thumb.on canvas{border-color:var(--acc)}.thumb.on{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:0 10px;height:128px;overflow-y:auto}
.grid button{font-size:27px;background:none;border:0;padding:3px 0;cursor:pointer;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

.txtin{display:flex;gap:8px;padding:0 12px 8px}
.txtin input{flex:1;min-width:0;background:#24242c;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.note{color:var(--mute);font-size:12px;padding:2px 16px}
.itembar{display:flex;align-items:center;gap:8px;padding:0 12px 6px}
#busy{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;font-weight:600}
#busy div{width:38px;height:38px;border:4px solid #fff3;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#out{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);gap:14px;text-align:center}
#out img{max-width:100%;max-height:62vh;border-radius:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#out p{color:#ccc;margin:0;font-size:14px}
#out .acts{display:flex;gap:10px}

<header>
 <span class="brand">Kilau</span>
 <button class="btn sm" id="bOpen" title="Buka foto"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg></button>

</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
const SRC_MAX=2560, PREV_MAX=1200;
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ---------- data ---------- */
const ADJ=[['bright','Kecerahan',-100,100],['contrast','Kontras',-100,100],['sat','Saturasi',-100,100],['warm','Kehangatan',-100,100],['tint','Rona',-100,100],['highl','Sorotan',-100,100],['shadow','Bayangan',-100,100],['fade','Pudar',0,100],['sharp','Ketajaman',0,100],['vig','Vinyet',0,100],['grain','Butiran',0,100]];
const FILTERS=[
 {id:'asli',n:'Asli',p:{}},
 {id:'cerah',n:'Cerah',p:{bright:14,contrast:8,sat:12}},
 {id:'segar',n:'Segar',p:{bright:8,sat:18,contrast:10,warm:-6},hi:[0,8,4]},
 {id:'hangat',n:'Hangat',p:{warm:30,sat:8,bright:4}},
 {id:'sejuk',n:'Sejuk',p:{warm:-30,contrast:6}},
 {id:'lembut',n:'Lembut',p:{fade:30,contrast:-12,sat:-12,bright:6}},
 {id:'pastel',n:'Pastel',p:{fade:25,sat:-30,bright:10},hi:[18,0,12],sh:[0,6,14]},
 {id:'peach',n:'Persik',p:{bright:10,warm:12,fade:12},hi:[22,6,0]},
 {id:'senja',n:'Senja',p:{warm:35,contrast:10,vig:25},hi:[20,0,6],sh:[10,0,24]},
 {id:'tropis',n:'Tropis',p:{sat:28,contrast:12},hi:[16,6,-10],sh:[-10,10,16]},
 {id:'kota',n:'Kota',p:{contrast:22,sat:-18,vig:20},hi:[14,8,-6],sh:[-8,6,18]},
 {id:'film',n:'Film',p:{fade:35,grain:30,contrast:6,warm:10,vig:20},sh:[0,10,12]},
 {id:'retro',n:'Retro',p:{warm:22,fade:30,sat:-25,grain:20,vig:35},hi:[14,8,-14]},
 {id:'malam',n:'Malam',p:{contrast:18,bright:-8,sat:10,warm:-18,vig:30},sh:[0,0,20]},
 {id:'mono',n:'Mono',mono:1,p:{contrast:12}},
 {id:'noir',n:'Noir',mono:1,p:{contrast:45,vig:45,grain:15}},
 {id:'sepia',n:'Sepia',mono:1,p:{contrast:6,fade:10},hi:[30,14,-14],sh:[22,8,-12]},
];
const STICKERS='❤️ 💖 💕 ✨ ⭐ 🌟 💫 🔥 🌸 🌼 🌷 🌹 🦋 🌈 ☀️ 🌙 ⚡ ☁️ 🎀 👑 💎 🎉 🎈 🎂 🍓 🍒 🍑 🍉 🧋 🍦 🐱 🐶 🐰 🐻 🧸 🐥 😎 😍 🥰 😘 😂 🤩 😇 🥳 😜 🤪 😴 🙈 👍 ✌️ 🤟 🙏 👀 💯 💋 📸 🎵 🎧 🌴 🌊 🏖️ ✈️ 💬 💭'.split(' ');
const COLORS=['#ffffff','#111111','#ff4d5e','#ff8a3d','#ffd23f','#5ee07a','#38c9ff','#4d6bff','#b45cff','#ff6fcf','#a0522d','#9aa0a6'];
const FONTS=[['Sans','800','-apple-system,"Helvetica Neue",Arial,sans-serif'],['Serif','700','Georgia,"Times New Roman",serif'],['Tegas','900','"Arial Black","Helvetica Neue",Impact,sans-serif'],['Tulis','400','"Snell Roundhand","Brush Script MT","Segoe Script",cursive'],['Mesin','700','"Courier New",Courier,monospace'],['Bulat','800','"Arial Rounded MT Bold","Avenir Next",Verdana,sans-serif']];
const FRAMES=[['none','Tanpa'],['putih','Putih'],['hitam','Hitam'],['polaroid','Polaroid'],['film','Film'],['bulat','Sudut Bulat'],['ganda','Garis Ganda'],['pelangi','Pelangi'],['bintik','Polkadot'],['kabur','Tepi Lembut']];
const BRUSH=[['draw','Kuas'],['marker','Stabilo'],['neon','Neon'],['mosaic','Mosaik'],['blur','Blur']];
const TABS=[
 ['filter','Filter','<circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><circle cx="12" cy="15" r="5"/>'],
 ['adjust','Atur','<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'],
 ['crop','Potong','<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/>'],
 ['beauty','Cantik','<path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.7z"/>'],
 ['sticker','Stiker','<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/>'],
 ['text','Teks','<path d="M5 6V4h14v2M12 4v16M9 20h6"/>'],
 ['brush','Kuas','<path d="M18 3l3 3-9.5 9.5-3-3z"/><path d="M8.5 12.5C5 13 5 16 4 19c3-1 6-1 6.5-4.5"/>'],
 ['frame','Bingkai','<rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="10" height="10"/>'],
];

/* ---------- state ---------- */
const S={src:null,rot:0,flip:false,straight:0,crop:null,adj:{},filter:'asli',fstr:100,beauty:{smooth:0,glow:0,slim:0},items:[],strokes:[],frame:'none'};
function resetEdits(){S.rot=0;S.flip=false;S.straight=0;S.crop=null;S.adj={};for(const a of ADJ)S.adj[a[0]]=0;S.filter='asli';S.fstr=100;S.beauty={smooth:0,glow:0};S.items=[];S.strokes=[];S.frame='none';}
resetEdits();
let tab='filter', sel=-1, showOrig=false, cropDraft=null, aspect=null;
let adjSel='bright', beautySel='smooth', brushMode='draw', brushColor='#ffffff', brushSize=0.02, spotSize=0.04;
let txtColor='#ffffff', txtStyle='garis', txtFont=0;

/* ---------- history ---------- */
let hist=[], fut=[], cur=null;
function snap(){return JSON.stringify({rot:S.rot,flip:S.flip,straight:S.straight,crop:S.crop,adj:S.adj,filter:S.filter,fstr:S.fstr,beauty:S.beauty,frame:S.frame,strokes:S.strokes,items:S.items.map(({_hw,_hh,...r})=>r)})}
function commit(){const s=snap();if(s===cur)return;if(cur)hist.push(cur);if(hist.length>60)hist.shift();cur=s;fut=[];updHist();}
function restore(s){Object.assign(S,JSON.parse(s));sel=-1;if(tab==='crop')cropDraft=S.crop?{...S.crop}:{x:0,y:0,w:1,h:1};buildTools();req();}
function undo(){if(!hist.length)return;fut.push(cur);cur=hist.pop();restore(cur);updHist();}
function redo(){if(!fut.length)return;hist.push(cur);cur=fut.pop();restore(cur);updHist();}
function updHist(){$('#bUndo').disabled=!hist.length;$('#bRedo').disabled=!fut.length;}

/* ---------- image processing ---------- */
function boxBlur(src,w,h,r,passes){
 let a=new Uint8ClampedArray(src), t=new Uint8ClampedArray(src.length);
 for(let p=0;p<passes;p++){blurH(a,t,w,h,r);blurV(t,a,w,h,r);}
 return a;
}
function blurH(s,o,w,h,r){const div=2*r+1;
 for(let y=0;y<h;y++){const row=y*w*4;
  for(let c=0;c<3;c++){let acc=0;
   for(let k=-r;k<=r;k++){const x=k<0?0:(k>w-1?w-1:k);acc+=s[row+x*4+c];}
   for(let x=0;x<w;x++){o[row+x*4+c]=acc/div;const xa=x+r+1>w-1?w-1:x+r+1, xr=x-r<0?0:x-r;acc+=s[row+xa*4+c]-s[row+xr*4+c];}
  }}
}
function blurV(s,o,w,h,r){const div=2*r+1, st=w*4;
 for(let x=0;x<w;x++){const col=x*4;
  for(let c=0;c<3;c++){let acc=0;
   for(let k=-r;k<=r;k++){const y=k<0?0:(k>h-1?h-1:k);acc+=s[y*st+col+c];}
   for(let y=0;y<h;y++){o[y*st+col+c]=acc/div;const ya=y+r+1>h-1?h-1:y+r+1, yr=y-r<0?0:y-r;acc+=s[ya*st+col+c]-s[yr*st+col+c];}
  }}
}
const blurRad=(w,h)=>Math.max(2,Math.round(Math.max(w,h)*0.007));
function soft(v,lo,hi){return v<lo?Math.max(0,1-(lo-v)/10):v>hi?Math.max(0,1-(v-hi)/10):1}
function hash(x,y){let n=Math.imul(x,374761393)+Math.imul(y,668265263)|0;n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295;}

function process(id,w,h,cfg,opt){
 const d=id.data, f=FILTERS.find(x=>x.id===cfg.filter)||FILTERS[0], k=cfg.fstr/100;
 const P={};for(const a of ADJ)P[a[0]]=(cfg.adj[a[0]]||0)+(f.p[a[0]]||0)*k;
 const mono=f.mono?k:0, hi=(f.hi||[0,0,0]).map(v=>v*k), sh=(f.sh||[0,0,0]).map(v=>v*k);
 const n=w*h*4;
 // beauty: skin-aware smoothing + brightening
 const sm=(cfg.beauty.smooth||0)/100, gl=(cfg.beauty.glow||0)/100;
 if(sm>0||gl>0){const bl=opt.getBlur();
  for(let i=0;i<n;i+=4){const r=d[i],g=d[i+1],b=d[i+2];
   const cb=128-0.168736*r-0.331264*g+0.5*b, cr=128+0.5*r-0.418688*g-0.081312*b;
   const s=soft(cb,77,127)*soft(cr,133,173); if(s<=0)continue;
   const br=bl[i],bg=bl[i+1],bb=bl[i+2];
   const diff=(Math.abs(br-r)+Math.abs(bg-g)+Math.abs(bb-b))/3, e=diff>34?0:1-diff/34;
   const a=sm*s*e*0.96;
   let R=r+(br-r)*a, G=g+(bg-g)*a, B=b+(bb-b)*a;
   if(gl>0){const t=gl*s*0.32;R+=(255-R)*t*0.62;G+=(255-G)*t*0.56;B+=(255-B)*t*0.52;}
   d[i]=R;d[i+1]=G;d[i+2]=B;}
 }
 if(P.sharp>0){const bl=opt.getSharp(), am=P.sharp/100*1.6;
  for(let i=0;i<n;i+=4){d[i]+=(d[i]-bl[i])*am;d[i+1]+=(d[i+1]-bl[i+1])*am;d[i+2]+=(d[i+2]-bl[i+2])*am;}}
 const B=P.bright*0.9, cf=P.contrast>=0?1+P.contrast/100*1.3:1+P.contrast/100*0.85, sat=1+P.sat/100;
 const W=P.warm*0.45, T=P.tint*0.4, F=P.fade/100, V=P.vig/100, G=P.grain, HL=P.highl/100, SH=P.shadow/100;
 const cx=w/2, cy=h/2, md=cx*cx+cy*cy, toned=hi[0]||hi[1]||hi[2]||sh[0]||sh[1]||sh[2];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
  let r=d[i]+B, g=d[i+1]+B, b=d[i+2]+B;
  if(HL||SH){const l=(0.299*r+0.587*g+0.114*b)/255;
   const adj=(HL*(l>0.5?(l-0.5)*2:0)*(HL>0?(1-l):l)*120)+(SH*(l<0.5?(0.5-l)*2:0)*(SH>0?(1-l):l)*120);
   r+=adj;g+=adj;b+=adj;}
  r=(r-128)*cf+128;g=(g-128)*cf+128;b=(b-128)*cf+128;
  const L=0.299*r+0.587*g+0.114*b;
  r=L+(r-L)*sat;g=L+(g-L)*sat;b=L+(b-L)*sat;
  if(mono){r+=(L-r)*mono;g+=(L-g)*mono;b+=(L-b)*mono;}
  r+=W;b-=W;g-=T;r+=T*0.3;b+=T*0.3;
  if(toned){const l=L<0?0:L>255?1:L/255, m=1-l;r+=hi[0]*l+sh[0]*m;g+=hi[1]*l+sh[1]*m;b+=hi[2]*l+sh[2]*m;}

function buildBase(maxSide,crop,src=S.src){

 const c=crop||{x:0,y:0,w:1,h:1}, cw=RW*c.w, ch=RH*c.h, sc=Math.min(1,maxSide/Math.max(cw,ch));
 const out=document.createElement('canvas');out.width=Math.max(1,Math.round(cw*sc));out.height=Math.max(1,Math.round(ch*sc));
 const x=out.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';

/* ---------- overlays: strokes, items, frame ---------- */
function fxLayer(src,w,h,kind){
 const div=kind==='mosaic'?Math.max(6,Math.round(Math.max(w,h)/55)):kind==='heal'?Math.max(4,Math.round(Math.max(w,h)/90)):Math.max(6,Math.round(Math.max(w,h)/45));

 return o;
}
function pathStroke(x,st,w,h){const p=st.p;x.beginPath();x.moveTo(p[0][0]*w,p[0][1]*h);

 for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2*w,my=(p[i][1]+p[i+1][1])/2*h;x.quadraticCurveTo(p[i][0]*w,p[i][1]*h,mx,my);}
 if(p.length>1){const l=p[p.length-1];x.lineTo(l[0]*w,l[1]*h);}
 x.lineCap='round';x.lineJoin='round';x.lineWidth=st.w*w;}
function drawStrokes(c,w,h){
 if(!S.strokes.length)return;
 for(const kind of ['heal','mosaic','blur']){const list=S.strokes.filter(s=>s.k===kind);if(!list.length)continue;
  const layer=fxLayer(c.canvas,w,h,kind), m=document.createElement('canvas');m.width=w;m.height=h;const mx=m.getContext('2d');
  for(const st of list){
   if(kind==='heal'){const [px,py]=st.p[0], r=st.w*w/2, g=mx.createRadialGradient(px*w,py*h,0,px*w,py*h,r);g.addColorStop(0,'#000');g.addColorStop(.6,'#000');g.addColorStop(1,'#0000');mx.fillStyle=g;mx.beginPath();mx.arc(px*w,py*h,r,0,7);mx.fill();}
   else{pathStroke(mx,st,w,h);mx.strokeStyle='#000';mx.stroke();}
  }
  mx.globalCompositeOperation='source-in';mx.drawImage(layer,0,0);c.drawImage(m,0,0);
 }
 for(const st of S.strokes){if(!['draw','marker','neon'].includes(st.k))continue;c.save();pathStroke(c,st,w,h);
  if(st.k==='marker'){c.globalAlpha=.45;c.lineCap='square';c.strokeStyle=st.c;c.stroke();}
  else if(st.k==='neon'){c.shadowColor=st.c;c.shadowBlur=st.w*w*1.6;c.strokeStyle=st.c;c.stroke();c.shadowBlur=0;c.lineWidth=st.w*w*0.4;c.strokeStyle='#fff';c.stroke();}
  else{c.strokeStyle=st.c;c.stroke();}

}
function lum(hex){const v=parseInt(hex.slice(1),16);return (0.299*(v>>16)+0.587*(v>>8&255)+0.114*(v&255))/255;}
function drawItems(c,w,h,preview){
 S.items.forEach((it,idx)=>{const fs=it.size*w;c.save();c.translate(it.x*w,it.y*h);c.rotate(it.rot||0);c.textAlign='center';c.textBaseline='middle';
  let hw,hh;
  if(it.type==='emoji'){c.font=fs+'px '+EMOJI_FONT;c.fillText(it.text,0,fs*0.05);hw=fs*0.6;hh=fs*0.6;}
  else{const F=FONTS[it.font]||FONTS[0];c.font=F[1]+' '+fs+'px '+F[2];const lines=String(it.text).split('\n'), lh=fs*1.18;
   const mw=Math.max(...lines.map(l=>c.measureText(l).width),fs*0.5);hw=mw/2;hh=lines.length*lh/2;
   const y0=-hh+lh/2;
   if(it.style==='latar'){const px=fs*0.35,py=fs*0.18;c.fillStyle=it.color;const rx=-hw-px,ry=-hh-py,rw=mw+px*2,rh=hh*2+py*2,rr=fs*0.3;
    c.beginPath();if(c.roundRect)c.roundRect(rx,ry,rw,rh,rr);else c.rect(rx,ry,rw,rh);c.fill();hw+=px;hh+=py;
    c.fillStyle=lum(it.color)>0.6?'#111':'#fff';lines.forEach((l,i)=>c.fillText(l,0,y0+i*lh));}
   else{if(it.style==='garis'){c.lineJoin='round';c.lineWidth=fs*0.14;c.strokeStyle=lum(it.color)>0.5?'#111':'#fff';lines.forEach((l,i)=>c.strokeText(l,0,y0+i*lh));}
    else if(it.style==='bayang'){c.shadowColor='#000a';c.shadowBlur=fs*0.15;c.shadowOffsetY=fs*0.05;}
    else if(it.style==='neon'){c.shadowColor=it.color;c.shadowBlur=fs*0.45;}
    c.fillStyle=it.style==='neon'?'#fff':it.color;lines.forEach((l,i)=>c.fillText(l,0,y0+i*lh));
    if(it.style==='neon'){c.fillStyle=it.color;c.globalAlpha=.35;lines.forEach((l,i)=>c.fillText(l,0,y0+i*lh));}}
  }
  it._hw=hw/w;it._hh=hh/w;

}
function drawFrame(c,w,h,f){
 if(f==='none')return;const m=Math.min(w,h);c.save();
 const border=(t,col)=>{c.fillStyle=col;c.fillRect(0,0,w,t);c.fillRect(0,h-t,w,t);c.fillRect(0,0,t,h);c.fillRect(w-t,0,t,h);};
 if(f==='putih')border(m*0.04,'#fff');
 else if(f==='hitam')border(m*0.04,'#000');
 else if(f==='polaroid'){const t=m*0.05;c.fillStyle='#fbfaf6';c.fillRect(0,0,w,t);c.fillRect(0,0,t,h);c.fillRect(w-t,0,t,h);c.fillRect(0,h-m*0.17,w,m*0.17);}

 else if(f==='ganda'){border(m*0.03,'#fff');c.strokeStyle='#fff';c.lineWidth=m*0.006;c.strokeRect(m*0.05,m*0.05,w-m*0.1,h-m*0.1);}
 else if(f==='pelangi'){const t=m*0.035,g=c.createLinearGradient(0,0,w,h);['#ff4d5e','#ff8a3d','#ffd23f','#5ee07a','#38c9ff','#b45cff'].forEach((col,i,a)=>g.addColorStop(i/(a.length-1),col));c.strokeStyle=g;c.lineWidth=t*2;c.strokeRect(0,0,w,h);}
 else if(f==='bintik'){const t=m*0.06;border(t,'#ffd6e0');c.fillStyle='#fff';const s=t*0.5;for(let x=s;x<w;x+=t*0.9)for(const y of [t/2,h-t/2]){c.beginPath();c.arc(x,y,t*0.16,0,7);c.fill();}for(let y=s;y<h;y+=t*0.9)for(const x of [t/2,w-t/2]){c.beginPath();c.arc(x,y,t*0.16,0,7);c.fill();}}

}

  const n=document.createElement('div');n.className='note';n.textContent='Pilih bingkai, hasilnya langsung terlihat di foto.';T.append(n);
 }
}
function findLast(a,f){for(let i=a.length-1;i>=0;i--)if(f(a[i]))return i;return -1;}

/* ---------- tabs ---------- */
function buildTabs(){const n=$('#tabs');TABS.forEach(([id,name,svg])=>{const b=document.createElement('button');b.className='tab'+(id===tab?' on':'');b.dataset.t=id;b.innerHTML=`<svg viewBox="0 0 24 24">${svg}</svg>${name}`;b.onclick=()=>setTab(id);n.appendChild(b);});}
function setTab(t){if(t===tab)return;
 if(tab==='crop'){const d=cropDraft;S.crop=(d.x<0.001&&d.y<0.001&&d.w>0.999&&d.h>0.999)?null:{...d};commit();}
 tab=t;if(t==='crop'){cropDraft=S.crop?{...S.crop}:{x:0,y:0,w:1,h:1};sel=-1;}
 if(t!=='sticker'&&t!=='text')sel=-1;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 buildTools();req();
 if(t==='brush')hint('Gores di foto untuk menggambar');
 if(t==='crop')hint('Geser kotak atau sudutnya');}

/* ---------- crop ---------- */
function updateCropBox(){const b=$('#crop'),d=cropDraft;b.style.left=d.x*100+'%';b.style.top=d.y*100+'%';b.style.width=d.w*100+'%';b.style.height=d.h*100+'%';}
function ratioVal(){if(!aspect)return null;if(aspect==='orig'){const [w,h]=[S.src.width,S.src.height];return S.rot%2?h/w:w/h;}return +aspect;}
function applyAspect(){const r=ratioVal();if(!r)return;const [RW,RH]=rotDims();let w=1,h=RW/(RH*r);if(h>1){h=1;w=RH*r/RW;}cropDraft={x:(1-w)/2,y:(1-h)/2,w,h};}

/* ---------- pointer interaction ---------- */
const frame=$('#frame'), pts=new Map();let drag=null;
function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,cx:e.clientX,cy:e.clientY,fw:r.width};}
function hitTest(p){const w=cv.width,h=cv.height;for(let i=S.items.length-1;i>=0;i--){const it=S.items[i];if(it._hw==null)continue;
 const dx=(p.x-it.x)*w, dy=(p.y-it.y)*h, a=-(it.rot||0), lx=dx*Math.cos(a)-dy*Math.sin(a), ly=dx*Math.sin(a)+dy*Math.cos(a), pad=w*0.03;
 if(Math.abs(lx)<=it._hw*w+pad&&Math.abs(ly)<=it._hh*w+pad)return i;}return -1;}
frame.addEventListener('pointerdown',e=>{if(!S.src)return;e.preventDefault();frame.setPointerCapture(e.pointerId);const p=pos(e);pts.set(e.pointerId,p);
 if(tab==='crop'){if(pts.size>1)return;const d=cropDraft,tol=34/p.fw;
  const corners=[[d.x,d.y],[d.x+d.w,d.y],[d.x,d.y+d.h],[d.x+d.w,d.y+d.h]];let ci=-1,best=tol;
  corners.forEach(([x,y],i)=>{const dd=Math.hypot(x-p.x,(y-p.y)*cv.height/cv.width);if(dd<best){best=dd;ci=i;}});
  if(ci>=0){const o=corners[3-ci];drag={type:'corner',ax:o[0],ay:o[1]};}
  else if(p.x>=d.x&&p.x<=d.x+d.w&&p.y>=d.y&&p.y<=d.y+d.h)drag={type:'cmove',sx:p.x,sy:p.y,ox:d.x,oy:d.y};
  return;}
 if(tab==='brush'){if(pts.size>1){if(drag&&drag.type==='draw'){S.strokes.pop();drag=null;req();}return;}
  S.strokes.push({k:brushMode,c:brushColor,w:brushMode==='mosaic'||brushMode==='blur'?brushSize*2.5:brushSize,p:[[p.x,p.y]]});drag={type:'draw'};req();return;}
 if(tab==='beauty'&&beautySel==='spot'){if(pts.size===1){S.strokes.push({k:'heal',w:spotSize,p:[[p.x,p.y]]});commit();req();}return;}
 if(pts.size===1){const hit=hitTest(p);
  if(hit>=0){const changed=sel!==hit;sel=hit;const it=S.items[hit];drag={type:'move',sx:p.x,sy:p.y,ox:it.x,oy:it.y};
   const want=it.type==='text'?'text':'sticker';if(tab!==want)setTab(want);else if(changed)buildTools();}
  else if(sel>=0){sel=-1;buildTools();drag=null;}
  req();}
 else if(pts.size===2&&sel>=0){const [a,b]=[...pts.values()],it=S.items[sel];drag={type:'pinch',d0:Math.hypot(a.cx-b.cx,a.cy-b.cy),a0:Math.atan2(b.cy-a.cy,b.cx-a.cx),s0:it.size,r0:it.rot||0};}
});
frame.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pos(e);pts.set(e.pointerId,p);if(!drag)return;
 if(drag.type==='cmove'){const d=cropDraft;d.x=Math.min(1-d.w,Math.max(0,drag.ox+p.x-drag.sx));d.y=Math.min(1-d.h,Math.max(0,drag.oy+p.y-drag.sy));updateCropBox();}
 else if(drag.type==='corner'){const {ax,ay}=drag,sx=p.x>=ax?1:-1,sy=p.y>=ay?1:-1,[RW,RH]=rotDims(),r=ratioVal();
  let w=Math.max(0.06,Math.abs(p.x-ax)),h=Math.max(0.06,Math.abs(p.y-ay));if(r)h=w*RW/(RH*r);
  const mW=sx>0?1-ax:ax,mH=sy>0?1-ay:ay;if(w>mW){const f=mW/w;w*=f;if(r)h*=f;}if(h>mH){const f=mH/h;h*=f;if(r)w*=f;}
  cropDraft={x:sx>0?ax:ax-w,y:sy>0?ay:ay-h,w,h};updateCropBox();}
 else if(drag.type==='draw'){const st=S.strokes[S.strokes.length-1],l=st.p[st.p.length-1];if(Math.hypot(l[0]-p.x,(l[1]-p.y)*cv.height/cv.width)>0.004){st.p.push([+p.x.toFixed(4),+p.y.toFixed(4)]);req();}}
 else if(drag.type==='move'&&pts.size===1){const it=S.items[sel];if(!it)return;it.x=Math.min(1,Math.max(0,drag.ox+p.x-drag.sx));it.y=Math.min(1,Math.max(0,drag.oy+p.y-drag.sy));req();}
 else if(drag.type==='pinch'&&pts.size===2){const [a,b]=[...pts.values()],it=S.items[sel];if(!it)return;
  it.size=Math.min(0.9,Math.max(0.02,drag.s0*Math.hypot(a.cx-b.cx,a.cy-b.cy)/drag.d0));it.rot=drag.r0+Math.atan2(b.cy-a.cy,b.cx-a.cx)-drag.a0;req();}
});
function endPtr(e){if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
 if(drag&&(drag.type==='move'||drag.type==='pinch'||drag.type==='draw')){if(pts.size===0){commit();drag=null;if(tab==='sticker'||tab==='text')buildTools();}else if(drag.type==='pinch'){const it=S.items[sel],p=[...pts.values()][0];drag={type:'move',sx:p.x,sy:p.y,ox:it.x,oy:it.y};}}
 else if(pts.size===0)drag=null;}
frame.addEventListener('pointerup',endPtr);frame.addEventListener('pointercancel',endPtr);
frame.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

/* ---------- open / save ---------- */
function openPicker(){$('#file').value='';$('#file').click();}
$('#bOpen').onclick=openPicker;$('#bOpen2').onclick=openPicker;
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;busy(true);
 try{const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const s=Math.min(1,SRC_MAX/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  S.src=c;resetEdits();sel=-1;aspect=null;cache={key:''};hist=[];fut=[];cur=snap();updHist();
  $('#empty').style.display='none';$('#frame').style.display='block';$('#panel').classList.remove('off');
  ['#bSave','#bCmp'].forEach(s=>$(s).disabled=false);
  if(tab==='crop'){tab='';setTab('crop');}else{buildTools();}cv.width=0;render();
 }catch(err){alert('Foto tidak bisa dibuka. Coba foto lain.');}
 busy(false);});
function busy(on){$('#busy').style.display=on?'flex':'none';}
let outFile=null, outURL=null;
$('#bSave').onclick=async()=>{if(!S.src)return;if(tab==='crop')setTab('filter');sel=-1;busy(true);await new Promise(r=>setTimeout(r,30));
 try{const base=buildBase(SRC_MAX,S.crop),w=base.width,h=base.height,bx=base.getContext('2d',{willReadFrequently:true});const id=bx.getImageData(0,0,w,h),o=new Uint8ClampedArray(id.data);
  process(id,w,h,cfgS(),{getBlur:()=>boxBlur(o,w,h,blurRad(w,h),3),getSharp:()=>boxBlur(o,w,h,1,1)});bx.putImageData(id,0,0);compose(bx,w,h,false);
  const blob=await new Promise(r=>base.toBlob(r,'image/jpeg',0.93));
  outFile=new File([blob],'kilau-'+Date.now()+'.jpg',{type:'image/jpeg'});if(outURL)URL.revokeObjectURL(outURL);outURL=URL.createObjectURL(blob);
  $('#outImg').src=outURL;$('#out').style.display='flex';
 }catch(err){alert('Gagal menyimpan: '+err.message);}
 busy(false);req();};
$('#bShare').onclick=async()=>{if(!outFile)return;
 if(navigator.canShare&&navigator.canShare({files:[outFile]})){try{await navigator.share({files:[outFile]});return;}catch(e){if(e.name==='AbortError')return;}}
 const a=document.createElement('a');a.href=outURL;a.download=outFile.name;document.body.appendChild(a);a.click();a.remove();};
$('#bOutClose').onclick=()=>{$('#out').style.display='none';};
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
const cmp=$('#bCmp');
cmp.addEventListener('pointerdown',e=>{e.preventDefault();showOrig=true;req();});
['pointerup','pointerleave','pointercancel'].forEach(t=>cmp.addEventListener(t,()=>{if(showOrig){showOrig=false;req();}}));

buildTabs();buildTools();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
