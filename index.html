<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No Matter">
<meta name="theme-color" content="#0e0e12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>No Matter</title>
<style>
:root{--bg:#0e0e12;--panel:#17171d;--line:#2a2a33;--text:#f2f2f5;--mute:#8d8d99;--acc:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:8px 12px}
.brand{height:22px;width:auto;max-width:34vw;object-fit:contain;object-position:left;margin-right:auto;display:block;flex:0 1 auto;min-width:0}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:#fff;border:0;color:#0a0a0c}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.35}
.btn svg{width:18px;height:18px;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#frame{position:relative;overflow:hidden;touch-action:none;display:none;box-shadow:0 6px 30px #0009;
 background:repeating-conic-gradient(#3a3a42 0 25%,#2a2a30 0 50%) 0 0/18px 18px}
#cv{display:block;width:100%;height:100%}
#empty{text-align:center;padding:24px;max-width:340px}
#empty .logo{width:100%;max-width:320px;margin:0 auto 18px;display:block}
#empty p{color:var(--mute);margin:0 0 20px}
#empty .big{font-size:17px;padding:13px 26px;width:100%;margin-bottom:10px}
#empty .row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;display:none;
 background-image:linear-gradient(#fff5,#fff5),linear-gradient(#fff5,#fff5),linear-gradient(#fff5,#fff5),linear-gradient(#fff5,#fff5);
 background-size:1px 100%,1px 100%,100% 1px,100% 1px;background-position:33.33% 0,66.66% 0,0 33.33%,0 66.66%;background-repeat:no-repeat}
#crop i{position:absolute;width:20px;height:20px;border:4px solid #fff}
#crop i:nth-child(1){left:-5px;top:-5px;border-right:0;border-bottom:0}
#crop i:nth-child(2){right:-5px;top:-5px;border-left:0;border-bottom:0}
#crop i:nth-child(3){left:-5px;bottom:-5px;border-right:0;border-top:0}
#crop i:nth-child(4){right:-5px;bottom:-5px;border-left:0;border-top:0}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;font-size:12px;padding:5px 11px;border-radius:999px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .3s;z-index:3}
#panel{background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#panel.off{opacity:.4;pointer-events:none}
#tools{height:158px;padding:10px 0 4px;overflow-y:auto;overflow-x:hidden}
.tabs{display:flex;overflow-x:auto;border-top:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar,.thumbs::-webkit-scrollbar,.sw::-webkit-scrollbar{display:none}
.tab{flex:1 0 60px;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#fff}.tab.on svg{stroke:#fff;filter:drop-shadow(0 0 4px #fff8)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px 9px;scrollbar-width:none}
.chip{flex:none;background:#24242c;border:0;color:var(--text);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;position:relative}
.chip.on{background:#fff;color:#0a0a0c}
.chip.dot::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#7CFFB2}
.chip.pro::before{content:"AI";font-size:9px;font-weight:800;background:#7CFFB2;color:#000;border-radius:4px;padding:1px 3px;margin-right:5px;vertical-align:1px}
.row{display:flex;align-items:center;gap:10px;padding:2px 16px}
.lbl{font-size:12px;color:var(--mute);width:62px;flex:none}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 1px 4px #0008}
input[type=range]::-moz-range-track{height:4px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}
.val{width:36px;text-align:right;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:0 12px 6px}
.thumb{flex:none;width:62px;text-align:center;font-size:11px;color:var(--mute);background:none;border:0;padding:0;font-family:inherit;cursor:pointer}
.thumb canvas{width:62px;height:62px;border-radius:12px;display:block;border:2px solid transparent;margin-bottom:3px;background:#222}
.thumb.on canvas{border-color:#fff}.thumb.on{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:0 10px;height:132px;overflow-y:auto}
.grid button{font-size:27px;background:none;border:0;padding:3px 0;cursor:pointer;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sw{display:flex;gap:8px;padding:2px 14px 8px;overflow-x:auto}
.sw button{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #fff3;cursor:pointer}
.sw button.on{border-color:#fff;transform:scale(1.15)}
.txtin{display:flex;gap:8px;padding:0 12px 8px}
.txtin input{flex:1;min-width:0;background:#24242c;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.note{color:var(--mute);font-size:12px;padding:2px 16px}
.note.ai{color:#7CFFB2}
.itembar{display:flex;align-items:center;gap:8px;padding:0 12px 6px}
#busy{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;font-weight:600;text-align:center}
#busy .sp{width:38px;height:38px;border:4px solid #fff3;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.ovl{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:30;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#out{background:#000e;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);gap:14px;text-align:center}
#out img{max-width:100%;max-height:60vh;border-radius:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;background:repeating-conic-gradient(#3a3a42 0 25%,#2a2a30 0 50%) 0 0/18px 18px}
#out p{color:#ccc;margin:0;font-size:14px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:40}
#sheet .in{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#sheet .in button{background:#24242c;border:0;color:var(--text);border-radius:14px;padding:14px 6px;font:inherit;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
#sheet .in button span{font-size:22px}
#sheet .in .cancel{grid-column:1/-1;background:none;border:1px solid var(--line);flex-direction:row;justify-content:center}
.ovhead{display:flex;align-items:center;gap:10px;padding:8px 12px}
.ovhead b{flex:1;text-align:center}
.ovstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;touch-action:none}
.ovtools{background:var(--panel);border-top:1px solid var(--line);padding:10px 0 8px}
#camC{max-width:100%;max-height:100%;display:block}
#camV{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.camtop{display:flex;gap:8px;padding:8px 12px;overflow-x:auto}
.shutter{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#fff3;margin:4px auto 2px;display:block;cursor:pointer}
.shutter:active{background:#fff}
#camFlashScr{position:fixed;inset:0;background:#fff;display:none;z-index:60}
#camCount{position:absolute;font-size:110px;font-weight:800;color:#fff;text-shadow:0 2px 20px #000;display:none}
#colC{max-width:100%;max-height:100%;display:block;touch-action:none;box-shadow:0 6px 30px #0009}
#guide{position:absolute;left:0;right:0;border-top:2px dashed #7CFFB2;pointer-events:none;display:none}
#guide span{position:absolute;right:6px;top:-22px;font-size:11px;background:#000a;color:#7CFFB2;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<header>
 <img class="brand" src="brand.png" alt="No Matter">
 <button class="btn sm" id="bUndo" title="Urungkan" disabled><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a5 5 0 0 1 0 10h-2"/></svg></button>
 <button class="btn sm" id="bRedo" title="Ulangi" disabled><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a5 5 0 0 0 0 10h2"/></svg></button>
 <button class="btn sm" id="bCmp" title="Tahan untuk lihat asli" disabled><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
 <button class="btn sm" id="bMenu" title="Menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
 <button class="btn primary sm" id="bSave" disabled>Simpan</button>
</header>
<div id="stage">
 <div id="empty">
  <img class="logo" src="wordmark.png" alt="No Matter">
  <p>Editor foto & selfie. Semua diproses di HP kamu, tanpa upload.</p>
  <button class="btn primary big" data-act="open">Pilih Foto</button>
  <div class="row2"><button class="btn" data-act="cam">📷 Kamera</button><button class="btn" data-act="collage">▦ Kolase</button><button class="btn" data-act="batch">⧉ Massal</button></div>
 </div>
 <div id="frame"><canvas id="cv"></canvas><div id="crop"><i></i><i></i><i></i><i></i></div><div id="guide"><span>Mulai tinggi</span></div></div>
 <div id="hint"></div>
</div>
<div id="panel" class="off">
 <div id="tools"></div>
 <nav class="tabs" id="tabs"></nav>
</div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="fileMulti" accept="image/*" multiple hidden>
<div id="busy"><div><div class="sp"></div><span id="busyT">Memproses…</span></div></div>
<div id="out" class="ovl">
 <img id="outImg" alt="Hasil">
 <p id="outP">Ketuk <b>Simpan ke Foto</b>, atau tekan lama gambar lalu pilih "Simpan ke Foto".</p>
 <div class="acts"><button class="btn" id="bOutClose">Kembali</button><button class="btn primary" id="bShare">Simpan ke Foto</button></div>
</div>
<div id="sheet"><div class="in">
 <button data-act="open"><span>🖼</span>Foto Baru</button>
 <button data-act="cam"><span>📷</span>Kamera</button>
 <button data-act="collage"><span>▦</span>Kolase</button>
 <button data-act="batch"><span>⧉</span>Edit Massal</button>
 <button data-act="copy"><span>📋</span>Salin Edit</button>
 <button data-act="paste"><span>📥</span>Tempel Edit</button>
 <button class="cancel" data-act="close">Tutup</button>
</div></div>
<div id="cam" class="ovl">
 <div class="camtop"><button class="btn sm" id="camX">✕</button><button class="btn sm" id="camFlash">⚡ Flash: Mati</button><button class="btn sm" id="camTimer">⏱ 0 dtk</button><button class="btn sm" id="camBeauty">✨ Cantik: Nyala</button><button class="btn sm" id="camFlip">⟲ Balik</button></div>
 <div class="ovstage"><video id="camV" playsinline muted autoplay></video><canvas id="camC"></canvas><div id="camCount"></div></div>
 <div class="ovtools"><div class="chips" id="camF"></div><button class="shutter" id="camShot" aria-label="Ambil foto"></button></div>
</div>
<div id="camFlashScr"></div>
<div id="col" class="ovl">
 <div class="ovhead"><button class="btn sm" id="colX">✕</button><b>Kolase</b><button class="btn primary sm" id="colDone">Lanjut Edit</button></div>
 <div class="ovstage" id="colStage"><canvas id="colC"></canvas></div>
 <div class="ovtools" id="colTools"></div>
</div>
<script src="app.js"></script>
</body>
</html>
